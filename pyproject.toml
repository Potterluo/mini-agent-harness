[project]
name = "mini-agent-harness"
version = "0.1.0"
description = "A layered coding harness you can read in one sitting"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[project.scripts]
harness = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]